<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storm — Game 1 Diamond</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/site.css" />
    <link rel="stylesheet" href="../../assets/css/diamonds-web.css" />
    <script src="../../assets/js/theme.js"></script>
  </head>
  <body>
    <nav class="site-nav">
      <a class="brand" href="../../index.html"><img src="../../assets/storm-logo.png" alt="" /> Storm</a>
      <a href="../../index.html">Home</a>
      <a href="../../scouting.html">Scouting</a>
      <a href="../../games/game-01/lineup.html" aria-current="page">Game 1</a>
      <a href="../../games/game-02/lineup.html">Game 2</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">Dark</button>
    </nav>
    <div class="wrap">
      <header>
        <img src="../../assets/storm-logo.png" alt="Storm" width="120" height="72" />
        <div class="titles">
          <h1>Defensive Diamond</h1>
          <p>Game 1 · vs Hooks · 8/22/26 · ACP Field 3 · 9am</p>
        </div>
      </header>
      <p class="notes" style="margin-top:0">
        <a href="lineup.html">Lineup</a>
        ·
        <a href="../../print/game-01-diamonds.html">Print diamonds</a>
      </p>
      <div class="innings" role="tablist" aria-label="Inning">
        <button type="button" data-inning="1" aria-pressed="true">Inn 1</button>
        <button type="button" data-inning="2" aria-pressed="false">Inn 2</button>
        <button type="button" data-inning="3" aria-pressed="false">Inn 3</button>
        <button type="button" data-inning="4" aria-pressed="false">Inn 4</button>
        <button type="button" data-inning="5" aria-pressed="false">Inn 5</button>
      </div>
<div class="field-wrap">
        <svg viewBox="0 0 400 460" role="img" aria-labelledby="diamond-title">
          <title id="diamond-title">Baseball diamond with defensive assignments</title>

          <!-- Outfield grass already from container; infield dirt -->
          <polygon
            points="200,360 330,230 200,100 70,230"
            fill="#f3e6d4"
            stroke="#d4c4b0"
            stroke-width="1"
          />

          <!-- Baseline diamond -->
          <polygon
            points="200,360 330,230 200,100 70,230"
            fill="none"
            stroke="#9a9a9a"
            stroke-width="1.5"
          />

          <!-- Pitcher's mound -->
          <circle cx="200" cy="250" r="14" fill="#e8d5bc" stroke="#cbb89a" stroke-width="1" />

          <!-- Bases -->
          <rect x="194" y="352" width="12" height="12" fill="#fff" stroke="#666" stroke-width="1" transform="rotate(45 200 358)" />
          <rect x="324" y="224" width="12" height="12" fill="#fff" stroke="#666" stroke-width="1" transform="rotate(45 330 230)" />
          <rect x="194" y="94" width="12" height="12" fill="#fff" stroke="#666" stroke-width="1" transform="rotate(45 200 100)" />
          <rect x="64" y="224" width="12" height="12" fill="#fff" stroke="#666" stroke-width="1" transform="rotate(45 70 230)" />

          <!-- Position markers + names (updated by JS) -->
          <!-- CF -->
          <g class="spot" data-pos="CF" transform="translate(200,42)">
            <text class="pos-label" text-anchor="middle" y="-10">CF</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Meer A.</text>
          </g>
          <!-- LF -->
          <g class="spot" data-pos="LF" transform="translate(70,95)">
            <text class="pos-label" text-anchor="middle" y="-10">LF</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Knox P.</text>
          </g>
          <!-- RF -->
          <g class="spot" data-pos="RF" transform="translate(330,95)">
            <text class="pos-label" text-anchor="middle" y="-10">RF</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Elijah R.</text>
          </g>
          <!-- SS -->
          <g class="spot" data-pos="SS" transform="translate(130,175)">
            <text class="pos-label" text-anchor="middle" y="-10">SS</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Cal H.</text>
          </g>
          <!-- 2B -->
          <g class="spot" data-pos="2B" transform="translate(270,175)">
            <text class="pos-label" text-anchor="middle" y="-10">2B</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Lane P.</text>
          </g>
          <!-- 3B -->
          <g class="spot" data-pos="3B" transform="translate(95,250)">
            <text class="pos-label" text-anchor="middle" y="-10">3B</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Grayson P.</text>
          </g>
          <!-- 1B -->
          <g class="spot" data-pos="1B" transform="translate(305,250)">
            <text class="pos-label" text-anchor="middle" y="-10">1B</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Colby H.</text>
          </g>
          <!-- P -->
          <g class="spot" data-pos="P" transform="translate(200,250)">
            <text class="pos-label" text-anchor="middle" y="-18">P</text>
            <text class="pos-name pitcher" text-anchor="middle" y="6" data-name>Donovan C.</text>
          </g>
          <!-- C -->
          <g class="spot" data-pos="C" transform="translate(200,400)">
            <text class="pos-label" text-anchor="middle" y="-10">C</text>
            <text class="pos-name" text-anchor="middle" y="8" data-name>Gavin G.</text>
          </g>
        </svg>
      </div>

      <section class="bench" aria-live="polite">
        <h2>Bench</h2>
        <ul id="bench-list">
          <li>Beau T.</li>
          <li>Jack B.</li>
          <li>Jiayin L.</li>
          <li>Silas W.</li>
        </ul>
      </section>

    </div>

    <script>
      const innings = {
        1: {
          P: "Donovan C.",
          C: "Gavin G.",
          "1B": "Colby H.",
          "2B": "Lane P.",
          "3B": "Grayson P.",
          SS: "Cal H.",
          LF: "Knox P.",
          CF: "Meer A.",
          RF: "Elijah R.",
          bench: ["Beau T.", "Jack B.", "Jiayin L.", "Silas W."],
        },
        2: {
          P: "Cal H.",
          C: "Silas W.",
          "1B": "Donovan C.",
          "2B": "Knox P.",
          "3B": "Beau T.",
          SS: "Lane P.",
          LF: "Jack B.",
          CF: "Meer A.",
          RF: "Jiayin L.",
          bench: ["Colby H.", "Elijah R.", "Gavin G.", "Grayson P."],
        },
        3: {
          P: "Beau T.",
          C: "Gavin G.",
          "1B": "Colby H.",
          "2B": "Jack B.",
          "3B": "Grayson P.",
          SS: "Lane P.",
          LF: "Elijah R.",
          CF: "Meer A.",
          RF: "Jiayin L.",
          bench: ["Cal H.", "Donovan C.", "Knox P.", "Silas W."],
        },
        4: {
          P: "Knox P.",
          C: "Silas W.",
          "1B": "Donovan C.",
          "2B": "Lane P.",
          "3B": "Grayson P.",
          SS: "Cal H.",
          LF: "Beau T.",
          CF: "Colby H.",
          RF: "Jack B.",
          bench: ["Elijah R.", "Gavin G.", "Jiayin L.", "Meer A."],
        },
        5: {
          P: "Jack B.",
          C: "Gavin G.",
          "1B": "Colby H.",
          "2B": "Elijah R.",
          "3B": "Knox P.",
          SS: "Grayson P.",
          LF: "Jiayin L.",
          CF: "Meer A.",
          RF: "Silas W.",
          bench: ["Beau T.", "Cal H.", "Donovan C.", "Lane P."],
        },
      };

      const benchList = document.getElementById("bench-list");
      const buttons = document.querySelectorAll(".innings button");

      function showInning(n) {
        const data = innings[n];
        document.querySelectorAll(".spot").forEach((spot) => {
          const pos = spot.dataset.pos;
          const nameEl = spot.querySelector("[data-name]");
          nameEl.textContent = data[pos];
          nameEl.classList.toggle("pitcher", pos === "P");
        });
        benchList.innerHTML = data.bench.map((name) => `<li>${name}</li>`).join("");
        buttons.forEach((btn) => {
          btn.setAttribute("aria-pressed", btn.dataset.inning === String(n) ? "true" : "false");
        });
      }

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => showInning(Number(btn.dataset.inning)));
      });

      showInning(1);
    </script>
  </body>
</html>
